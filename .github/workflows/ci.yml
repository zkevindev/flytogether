name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    name: Go tests and coverage
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...
      - name: Race tests with statement coverage
        run: |
          mkdir -p test-results
          set -o pipefail
          go test -race -count=1 -covermode=atomic -coverpkg=./... -coverprofile=test-results/coverage.out ./... 2>&1 | tee test-results/go-test.txt
      - name: Coverage summary and HTML
        if: always()
        run: |
          if [ -s test-results/coverage.out ]; then
            go tool cover -func=test-results/coverage.out > test-results/coverage-functions.txt
            go tool cover -html=test-results/coverage.out -o test-results/coverage.html
            python3 scripts/coverage_summary.py test-results/coverage.out >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No Go coverage report was generated; check the failed test step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: go-coverage-${{ github.sha }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@2320916714171c258d01dbd81040d64d798c6f8e # v7.1.1
        with:
          use_oidc: true
          files: test-results/coverage.out
          disable_search: true
          flags: go
          name: go-unit
          fail_ci_if_error: true
  web:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit
      - run: npm run build
